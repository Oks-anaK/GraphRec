[project]
name = "pythonproject15"
version = "0.1.0"
description = ""
authors = [
    {name = "Oksana Konkina",email = "oksanka.808@mail.ru"}
]
requires-python = ">=3.12,<3.14.1"
dependencies = [
    "django (>=6.0.3,<7.0.0)",
    "djangorestframework (>=3.14)",
    "django-redis (>=5.4)",
    "networkx (>=3.6.1,<4.0.0)",
    "numpy (>=2.4.3,<3.0.0)",
    "scikit-learn (>=1.8.0,<2.0.0)",
    "psycopg[binary] (>=3.2,<4.0.0)",
    "python-dotenv (>=1.0,<2.0.0)",
    "coverage (>=7.13.5,<8.0.0)",
]


[tool.poetry.group.lint.dependencies]
black = ">=24.0"
flake8 = ">=6.0"
isort = ">=5.13"

[tool.black]
# Длина как в .flake8 (119). Не задавайте полный exclude — лучше extend-exclude,
# иначе сбросятся встроенные исключения Black (.git, __pycache__ и т.д.).
line-length = 119
target-version = ["py312", "py313"]
extend-exclude = '''
/(
  migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 119
skip_glob = ["*/migrations/*"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
